<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rewrite Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0f0f0e;--surface:#1a1a19;--surface-2:#212120;--surface-3:#2a2a28;--line:#2c2c2a;--line-2:#3a3a37;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#97968e;--accent:#9085e9;--accent-2:#b2aaf2;--accent-bg:#26233f;
  --good:#3fbf5a;--warn:#fab219;--bad:#e66767;--focus:#b2aaf2;
  --r:12px;--r-sm:8px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.6);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3{letter-spacing:-.01em;margin:0}
h1{font-size:24px;font-weight:650;outline:none}
h2{font-size:15px;font-weight:600}
.h3,h3{font-size:14px;font-weight:600;margin:6px 0 2px}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#111;padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}.stack-lg{display:flex;flex-direction:column;gap:18px}

/* layout */
#app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:236px;border-right:1px solid var(--line);background:#121211;display:flex;flex-direction:column;padding:16px 10px;z-index:10}
.main{margin-left:236px;min-height:100vh}
#view{max-width:1100px;margin:0 auto;padding:28px 32px 64px;outline:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{display:block;font-size:15px}.brand span{display:block;font-size:11px;color:var(--muted)}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#9085e9,#3987e5);color:#0f0f0e}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-size:14px;transition:background .15s,color .15s}
.nav-i:hover{background:var(--surface-2);color:var(--text)}
.nav-i.on{background:var(--surface-3);color:var(--text)}
.nav-i.on .ic{color:var(--accent-2)}
.side-foot{margin-top:auto;padding:8px}
.topbar{display:none}
.tabbar{display:none}
.more-sheet{display:none}
.sync-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--text-2);cursor:pointer}
.sync-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-chip.good .dot{background:var(--good)}.sync-chip.warn .dot{background:var(--warn)}.sync-chip.bad .dot{background:var(--bad)}

@media (max-width:959px){
  .sidebar{display:none}.main{margin-left:0}
  #view{padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,14,.92);backdrop-filter:blur(10px);z-index:9}
  .topbar .brand{padding:0}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(18,18,17,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;background:none;border:0;padding:6px 2px;border-radius:10px;cursor:pointer}
  .tab.on{color:var(--text);background:var(--surface-2)}
  .more-sheet{display:block;position:fixed;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:6px;z-index:11;min-width:220px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
  .more-sheet[hidden]{display:none}
  h1{font-size:21px}
}

/* page */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.page-h .sub{color:var(--muted);margin-top:4px;font-size:13.5px;max-width:640px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card>*+*{margin-top:12px}
.card-desc{margin-top:4px!important}
.card-desc{color:var(--muted);font-size:13px}
.card.hero{background:linear-gradient(180deg,#201e33 0%,var(--surface) 100%);border-color:#36315c}
.eyebrow{display:flex;align-items:center;gap:6px;color:var(--accent-2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.hero-t{font-size:19px;margin-bottom:4px}
.hero .row{margin-top:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-2.tight{gap:12px}
@media (max-width:820px){.grid-2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card .kpi{background:var(--surface-2)}
.kpi-l{color:var(--muted);font-size:12.5px}
.kpi-v{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.good .kpi-v{color:#7fe3a7}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:550;font-size:13.5px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#12101f}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:#c94a4a;border-color:#c94a4a;color:#fff}
.btn.danger-ghost{background:transparent;color:#f08a8a;border-color:#4a2b2b}
.btn.danger-ghost:hover{background:#2a1a1a}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* pills */
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;border:1px solid var(--line-2);color:var(--text-2);white-space:nowrap}
.pill.good{color:#8fe8b0;border-color:#2b5a3a;background:#14251a}
.pill.warn{color:#ffd27a;border-color:#5a4a1f;background:#251f10}
.pill.neutral{color:var(--text-2)}
.pill.muted{color:var(--muted)}
.pill-n{color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.brow,.erow,.jrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.brow:hover,.erow:hover,.jrow:hover{border-color:var(--line-2);background:var(--surface-3)}
.brow-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jrow{flex-direction:column;align-items:stretch;gap:4px}
.jrow-h{display:flex;gap:8px;align-items:center}
.jrow-q{color:var(--text-2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.jtype{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-2)}
.jtype.weekly{color:#7fd4ff}.jtype.note{color:var(--text-2)}
.star{color:var(--warn)}
.arow{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.acard{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:13.5px}
.kv>span:first-child{color:var(--muted)}
@media (max-width:600px){.kv{grid-template-columns:1fr;gap:0}}
.kvs{display:flex;flex-direction:column;gap:6px}
.countdown{font-size:12px;color:#ffd27a;background:#251f10;border:1px solid #4a3d1a;border-radius:999px;padding:2px 9px}
.countdown.closed{color:var(--muted);background:transparent;border-color:var(--line-2)}
.mini{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.mini-l{font-size:12px;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ach{display:flex;gap:10px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ach-i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-2);flex:none}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--text-2)}
.empty{text-align:center;padding:26px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty h3{font-size:15px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-bg);border:1px solid #3c3670;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:0}
#banners{max-width:1100px;margin:0 auto;padding:12px 32px 0;display:flex;flex-direction:column;gap:8px}
#banners:empty{display:none}
@media (max-width:959px){#banners{padding:10px 14px 0}}
.banner.warn{background:#251f10;border-color:#4a3d1a}
.method-note{max-width:720px}

/* behaviour grids */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.bcard:hover{border-color:var(--line-2);background:var(--surface-3)}
.bcard.on{border-color:var(--accent);background:var(--accent-bg)}
.bcard-e{font-size:22px}.bcard-n{font-weight:600}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lib-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
.lib-card:hover{border-color:var(--line-2)}
.lib-e{font-size:24px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tpl{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.alt-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border-radius:8px;padding:6px 6px 6px 12px;font-size:13.5px}
.res{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--text-2);font-size:13.5px}
.callout{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.summary{background:var(--surface-2);border-radius:10px;padding:12px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:13px;font-weight:550;color:var(--text-2)}
.lbl.inline{display:inline}
.req{color:var(--accent-2)}
.hint{font-size:12px;color:var(--muted);margin-top:-2px}
.field-err{color:#ff9b9b;font-size:12.5px}
.field-err:empty{display:none}
.has-err .input,.has-err .seg{border-color:#8a3b3b}
.input{width:100%;background:#141413;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;color:var(--text);transition:border-color .15s}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(144,133,233,.18)}
.input::placeholder{color:#6d6c66}
textarea.input{resize:vertical;min-height:44px}
.num-in{max-width:200px}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--text-2);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.rating-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rating-v{font-size:22px;font-weight:650;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.range{width:100%;accent-color:var(--accent);height:28px}
.range.unset{opacity:.55}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:#141413;border:1px solid var(--line-2);border-radius:10px;padding:3px;align-self:flex-start}
.seg-b{border:0;background:transparent;color:var(--text-2);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13.5px}
.seg-b.on{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--line-2) inset}
.seg.sm .seg-b{padding:4px 10px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--text);border-color:#4a4a46}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--text)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip-text{display:flex;flex-direction:column;gap:8px}
.tags-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#141413;border:1px solid var(--line-2);border-radius:9px;padding:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);border-radius:6px;padding:2px 4px 2px 8px;font-size:12.5px}
.tag-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.tag-new{flex:1;min-width:140px;border:0;background:transparent;outline:none;padding:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.filters label{display:flex;flex-direction:column;gap:4px;min-width:150px}
.filters label.grow{flex:1;min-width:200px}
.filters .input{padding:7px 10px}

/* wizard */
.stepper{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.stepper li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:11.5px}
.stepper li.on{color:var(--text);border-color:var(--accent)}
.stepper li.on span{background:var(--accent);color:#12101f}
.stepper li.done span{background:#24432f;color:#8fe8b0}
.wizard-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

/* prediction vs actual mini bars */
.pva{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:10px;padding:12px}
.pva-r{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px}
.pva-l{color:var(--muted)}
.pva-t{height:8px;background:#141413;border-radius:4px;overflow:hidden}
.pva-f{height:100%;border-radius:4px;transition:width .4s ease}
.pva b{text-align:right;font-variant-numeric:tabular-nums}

/* charts */
.chart{display:block;overflow:visible;touch-action:pan-y}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart-empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid transparent}
.sw.dash{width:14px;height:0;border-radius:0;border-width:2px 0 0;border-style:dashed}
.tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s;background:#0b0b0a;border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:280px}
.tip-t{font-weight:600;margin-bottom:4px}
.tip-r{display:flex;gap:7px;align-items:center;color:var(--text-2)}
.tip-r b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;padding-left:10px}
.hbars,.stks{display:flex;flex-direction:column;gap:8px}
.hbar,.stk{display:grid;grid-template-columns:minmax(80px,34%) 1fr 44px;gap:10px;align-items:center;font-size:13px;cursor:default}
.hbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.hbar-t,.stack-t{height:10px;background:#141413;border-radius:5px;overflow:hidden;display:flex;gap:2px}
.hbar-f{height:100%;border-radius:0 4px 4px 0}
.stack-f{height:100%}
.stack-f:last-child{border-radius:0 4px 4px 0}
.stack-empty{font-size:11px;color:var(--muted);line-height:10px;padding-left:6px}
.hbar-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.spark{flex:none}
.tbl summary{font-size:12.5px;color:var(--muted);cursor:pointer;margin-top:8px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{color:var(--muted);font-weight:550;font-size:12px}
tbody th{font-weight:500}

/* insights + coach */
.ins-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ins{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ins.good{box-shadow:inset 3px 0 0 var(--good)}.ins.warn{box-shadow:inset 3px 0 0 var(--warn)}
.ins-tag{flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:#1d2a3c;color:#8cc1ff;margin-top:2px}
.ins-tag.hypothesis{background:#2c2440;color:var(--accent-2)}
.ins-tag.info{background:var(--surface-3);color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bubble{border-radius:12px;padding:10px 14px;max-width:92%;font-size:14px}
.bubble.user{align-self:flex-end;background:var(--accent-bg);border:1px solid #3c3670}
.bubble.assistant{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.bubble-who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.bubble-b p+p,.bubble-b ul,.bubble-b p+ul,.bubble-b ul+p{margin-top:8px}
.bubble-b ul{padding-left:18px;margin:0}
.bubble.streaming .bubble-b{opacity:.9}
.chat-in{display:flex;flex-direction:column;gap:8px}

/* goals */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.goal{display:flex;flex-direction:column;gap:8px}
.goal.archived{opacity:.6}
.goal-v b{font-size:26px;font-variant-numeric:tabular-nums}
.meter{height:8px;background:#141413;border-radius:4px;overflow:hidden}
.meter>div{height:100%;border-radius:4px;transition:width .4s ease}
.goal-why{font-size:13px;color:var(--text-2)}
details.weekly summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.weekly[open] summary{margin-bottom:10px}
details.weekly>p{margin-bottom:10px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:40;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:480px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.6);animation:rise .18s ease}
.modal.wide{max-width:640px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}
.modal-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-f .danger-ghost{margin-right:auto}
#toasts{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:70;width:min(92vw,420px)}
@media (max-width:959px){#toasts{bottom:calc(80px + env(safe-area-inset-bottom))}}
.toast{background:#23213a;border:1px solid #4a4387;border-radius:10px;padding:10px 14px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .2s ease;transition:opacity .3s}
.toast.error{background:#2a1717;border-color:#6b2f2f}
.toast.out{opacity:0}
@media (forced-colors:active){.hbar-f,.stack-f,.pva-f,.meter>div{forced-color-adjust:none}}

@media (max-width:420px){.brow .spark{display:none}.kpis{grid-template-columns:1fr 1fr}.kpi-v{font-size:19px}}

/* ===== core/insights.js — local rule-based insights engine (no AI, runs on device) ===== */
const MIN_INSIGHT_N = 4;

function generateInsights(state, exps) {
  const out = [];
  const add = (kind, text, evidence, extra) => out.push(Object.assign({ kind, text, evidence }, extra || {}));
  const n = exps.length;
  if (n < MIN_INSIGHT_N) {
    add("info", `Pattern detection starts after ${MIN_INSIGHT_N} completed experiments. You have ${n} in this selection.`, null);
    return out;
  }

  // 1. systematic over/under-prediction
  const high = exps.filter(e => e.expectedDiscomfort != null && e.expectedDiscomfort >= 8 && e.actualDiscomfort != null);
  if (high.length >= 3) {
    const a = avg(high.map(e => e.actualDiscomfort)), p = avg(high.map(e => e.expectedDiscomfort));
    add("observation", `You predicted a discomfort of ${f1(p)} or more in ${high.length} experiments. The actual average was ${f1(a)}.`, `${high.length} experiments with prediction ≥ 8`);
    if (p - a >= 2) add("hypothesis", "Your strongest predictions may be systematically exaggerating the difficulty. When you next expect a 9, remind yourself what usually happens.", `based on ${high.length} experiments`);
  }
  const s = summarize(exps);
  if (s.nGaps >= MIN_INSIGHT_N && s.avgGap != null) {
    if (s.avgGap >= 1.5) add("observation", `On average you expect ${f1(s.avgGap)} points more discomfort than you actually feel (${s.nGaps} experiments).`, `mean prediction gap +${f1(s.avgGap)}`);
    else if (s.avgGap <= -1.5) add("observation", `Your experiments have been ${f1(-s.avgGap)} points harder than you predicted on average. The actions may be too big right now; smaller steps give cleaner evidence.`, `mean prediction gap ${f1(s.avgGap)}`);
    else if (s.accuracy != null && s.accuracy >= 0.6) add("observation", `Your predictions are now fairly accurate: ${pct(s.accuracy)} were within 1 point of what happened.`, `${s.nGaps} experiments`);
  }

  // 2. time of day concentration
  const tod = timeOfDayStats(exps).filter(b => b.n > 0);
  if (n >= 6 && tod.length) {
    const top = [...tod].sort((a, b) => b.n - a.n)[0];
    if (top.n / n >= 0.4 && top.n >= 3) {
      add("observation", `${pct(top.n / n)} of your experiments happen in the ${top.label.toLowerCase()} (${top.range}).`, `${top.n} of ${n}`);
      if (s.avgUrge != null && top.avgUrge != null && top.avgUrge - s.avgUrge >= 1)
        add("hypothesis", `Urges are stronger in the ${top.label.toLowerCase()} (avg ${f1(top.avgUrge)} vs ${f1(s.avgUrge)} overall). Planning an alternative activity before that time may help.`, `${top.n} experiments`);
    }
    const scored = tod.filter(b => b.nScored >= 3 && b.followThrough != null);
    if (scored.length >= 2) {
      const worst = [...scored].sort((a, b) => a.followThrough - b.followThrough)[0], best = [...scored].sort((a, b) => b.followThrough - a.followThrough)[0];
      if (best.followThrough - worst.followThrough >= 0.3)
        add("observation", `You follow through ${pct(best.followThrough)} of the time in the ${best.label.toLowerCase()} but only ${pct(worst.followThrough)} in the ${worst.label.toLowerCase()}.`, `${best.nScored} and ${worst.nScored} experiments`);
    }
  }

  // 3. triggers
  const trig = triggerStats(exps);
  if (trig.length && trig[0].n >= 3) {
    const t = trig[0];
    add("observation", `"${t.label}" is your most frequent trigger (${t.n} experiments, average urge ${f1(t.avgUrge)}).`, `${t.n} of ${n}`);
  }
  const strong = trig.filter(t => t.n >= 3 && t.avgUrge != null && s.avgUrge != null && t.avgUrge - s.avgUrge >= 1.5);
  if (strong.length) add("observation", `"${strong[0].label}" is linked to stronger urges (${f1(strong[0].avgUrge)} vs ${f1(s.avgUrge)} overall).`, `${strong[0].n} experiments`);

  // 4. alternatives that work
  const alts = alternativeStats(exps).filter(a => a.nScored >= 2);
  if (alts.length >= 2) {
    const ranked = [...alts].sort((a, b) => (b.followThrough - a.followThrough) || ((a.avgActual ?? 10) - (b.avgActual ?? 10)));
    const best = ranked[0], worst = ranked[ranked.length - 1];

      add("observation", `"${best.label}" works best so far: done ${pct(best.followThrough)} of the time vs ${pct(worst.followThrough)} for "${worst.label}".`, `${best.nScored} vs ${worst.nScored} experiments`);
  }

  // 5. behaviour trends
  behaviourProgress(state, exps).forEach(b => {
    const t = b.trend;
    if (t.status === "improving") add("observation", `${b.emoji} ${b.name}: your starting urge dropped from ${f1(t.first)} to ${f1(t.last)} (first vs last ${t.k} experiments).`, `${t.n} experiments`, { behaviourId: b.id, tone: "good" });
    if (t.status === "worsening") add("observation", `${b.emoji} ${b.name}: your starting urge rose from ${f1(t.first)} to ${f1(t.last)}. Check stress, sleep, or whether the action is too hard.`, `${t.n} experiments`, { behaviourId: b.id, tone: "warn" });
    if (t.status === "stagnating") add("hypothesis", `${b.emoji} ${b.name} has plateaued (urge ${f1(t.first)} → ${f1(t.last)}). A different alternative action or a new situation may produce new evidence.`, `${t.n} experiments`, { behaviourId: b.id });
  });

  // 6. recurring setbacks
  const setbacks = exps.filter(e => e.outcome === "not_completed");
  if (setbacks.length >= 2) {
    const st = triggerStats(setbacks).filter(t => t.n >= 2);
    if (st.length) add("observation", `${st[0].n} of your ${setbacks.length} unsuccessful attempts followed "${st[0].label}". That situation might need a prepared plan.`, `${setbacks.length} setbacks`);
    const sb = timeOfDayStats(setbacks).filter(b => b.n >= 2).sort((a, b) => b.n - a.n)[0];
    if (sb && sb.n / setbacks.length >= 0.5) add("observation", `Most setbacks (${sb.n} of ${setbacks.length}) happen in the ${sb.label.toLowerCase()}.`, `${setbacks.length} setbacks`);
  }

  // 7. emotional intensity over time
  const emo = emotionStats(exps);
  if (emo.length && emo[0].n >= 3) add("observation", `The emotion you log most is "${emo[0].label}" (${emo[0].n} times, average urge ${f1(emo[0].avgUrge)}).`, `${emo[0].n} experiments`);
  const urges = vals(exps, e => e.urge);
  if (urges.length >= 8) {
    const half = Math.floor(urges.length / 2), a = avg(urges.slice(0, half)), b = avg(urges.slice(half));
    if (Math.abs(a - b) >= 1) add("observation", `Overall starting intensity went from ${f1(a)} (earlier half) to ${f1(b)} (recent half).`, `${urges.length} experiments`, { tone: b < a ? "good" : "warn" });
  }

  // 8. durations
  const d = durationStats(exps);
  if (d.n >= 3 && d.expected > 0 && d.actual != null && d.expected / Math.max(d.actual, 1) >= 1.5)
    add("observation", `You expect discomfort to last about ${Math.round(d.expected)} minutes; it actually lasted about ${Math.round(d.actual)} minutes on average.`, `${d.n} experiments`);

  // 9. belief confidence
  const conf = exps.filter(e => e.beliefConfidence != null);
  if (conf.length >= 4) {
    const k = Math.max(2, Math.floor(conf.length / 3)), a = avg(conf.slice(0, k).map(e => e.beliefConfidence)), b = avg(conf.slice(-k).map(e => e.beliefConfidence));
    if (b - a >= 15) add("observation", `Your confidence in the new belief grew from ${Math.round(a)}% to ${Math.round(b)}%.`, `${conf.length} ratings`, { tone: "good" });
  }
  if (out.length === 0) add("info", "No clear patterns yet in this selection. That's normal; keep logging and check back.", `${n} experiments`);
  return out;
}

/* evidence-based achievements, each dated by the record that earned it */
function achievements(state) {
  const fin = finished(state), out = [];
  const add = (key, title, text, at) => at && out.push({ key, title, text, at });
  if (fin[0]) add("first", "First experiment", "You tested an old prediction for the first time.", fin[0].completedAt);
  if (fin[9]) add("ten", "10 experiments", "Ten pieces of real evidence.", fin[9].completedAt);
  if (fin[49]) add("fifty", "50 experiments", "A serious body of evidence.", fin[49].completedAt);
  const busted = fin.find(e => gapOf(e) != null && gapOf(e) >= 3);
  if (busted) add("busted", "Prediction busted", `Expected ${busted.expectedDiscomfort}, actually ${busted.actualDiscomfort}.`, busted.completedAt);
  const byB = {};
  fin.forEach(e => { (byB[e.behaviourId] = byB[e.behaviourId] || []).push(e); });
  for (const id in byB) {
    const list = byB[id];
    const i = list.findIndex((e, j) => j > 0 && e.outcome === "completed" && list.slice(0, j).some(x => x.outcome === "not_completed"));
    if (i > 0) { add("comeback-" + id, "Back after a setback", `${behaviourLabel(state, id).name}: you followed through after an unsuccessful attempt.`, list[i].completedAt); }
    const t = urgeTrend(list);
    if (t.status === "improving") add("weaker-" + id, "Reaction weakening", `${behaviourLabel(state, id).name}: starting urge ${f1(t.first)} → ${f1(t.last)}.`, list[list.length - 1].completedAt);
    const alts = new Set(list.map(e => norm(e.alternative)).filter(Boolean));
    if (alts.size >= 3) add("explorer-" + id, "Experimenter", `${behaviourLabel(state, id).name}: you've tested ${alts.size} different alternatives.`, list[list.length - 1].completedAt);
  }
  const passed = fin.filter(e => e.moduleData.cravingPassed === true);
  if (passed[0]) add("craving1", "Craving ridden out", "A craving passed without a cigarette.", passed[0].completedAt);
  if (passed[4]) add("craving5", "5 cravings passed", "Five cravings passed without smoking.", passed[4].completedAt);
  const weekly = live(state.journal).filter(j => j.type === "weekly").sort((a, b) => a.createdAt - b.createdAt);
  if (weekly[0]) add("weekly", "First weekly reflection", "You reviewed a whole week of evidence.", weekly[0].createdAt);
  return out.sort((a, b) => b.at - a.at);
}

function windowInfo(e, settings, now) {
  if (!settings.windowEnabled) return null;
  const hours = e.windowHours || settings.windowHours;
  const left = e.startedAt + hours * HOUR - (now || Date.now());
  return { hours, left, open: left > 0 };
}

function recommendNext(state, now) {
  now = now || Date.now();
  const act = activeExps(state);
  for (const e of act) {
    const w = windowInfo(e, state.settings, now);
    if (w && w.open && w.left < HOUR) return { title: `Record your ${behaviourLabel(state, e.behaviourId).name} result`, body: `The experiment window closes in ${fmtDuration(w.left)}. Record what actually happened while it's fresh.`, action: { type: "finish", id: e.id } };
  }
  if (act.length) return { title: `${plural(act.length, "experiment")} in progress`, body: "Do the alternative action, then record what actually happened, including partial results.", action: { type: "practice" } };
  const fin = finished(state);
  const behaviours = live(state.behaviours).filter(b => !b.archived);
  if (!fin.length) {
    const b = behaviours[0];
    return { title: "Run your first experiment", body: "Pick one behaviour, write down what you predict will happen, do the alternative action, then compare. One experiment takes 10–20 minutes.", action: { type: "start", behaviourId: b ? b.id : null } };
  }
  const wk = startOfWeek(now), thisWeek = fin.filter(e => e.completedAt >= wk);
  const hasWeekly = live(state.journal).some(j => j.type === "weekly" && j.weekKey === weekKey(now));
  if (thisWeek.length >= 3 && !hasWeekly && weekdayIdx(now) >= 4) return { title: "Write this week's reflection", body: `You ran ${thisWeek.length} experiments this week. A 5-minute review turns them into lessons.`, action: { type: "weekly" } };
  const prog = behaviourProgress(state, fin).filter(b => !b.missing && behaviours.some(x => x.id === b.id));
  const stag = prog.find(b => b.trend.status === "stagnating" || b.trend.status === "worsening");
  if (stag) {
    const b = state.behaviours[stag.id];
    const tried = new Set(fin.filter(e => e.behaviourId === stag.id).map(e => norm(e.alternative)));
    const untried = (b.alternatives || []).find(a => !tried.has(norm(a)));
    return { title: `Change the experiment for ${stag.name}`, body: untried ? `Progress has flattened. Try a different alternative: "${untried}".` : "Progress has flattened. Try the same action in a different situation, or make it smaller.", action: { type: "start", behaviourId: stag.id, alternative: untried || null } };
  }
  const stale = prog.filter(b => b.n > 0 && b.lastAt && now - b.lastAt > 4 * DAY).sort((a, b) => a.lastAt - b.lastAt)[0];
  if (stale) return { title: `Pick ${stale.name} back up`, body: `Your last experiment here was ${fmtDuration(now - stale.lastAt)} ago. Evidence fades without repetition.`, action: { type: "start", behaviourId: stale.id } };
  const recent = fin.slice(-10), byUrge = groupStats(recent, e => e.behaviourId).filter(g => behaviours.some(b => b.id === g.key) && g.avgUrge != null).sort((a, b) => b.avgUrge - a.avgUrge)[0];
  if (byUrge) return { title: `Practise ${behaviourLabel(state, byUrge.key).name}`, body: `It currently has your strongest starting urge (avg ${f1(byUrge.avgUrge)}). That's where new evidence counts most.`, action: { type: "start", behaviourId: byUrge.key } };
  return { title: "Run another experiment", body: "Repetition is what turns single results into a new automatic reaction.", action: { type: "start", behaviourId: behaviours[0] ? behaviours[0].id : null } };
}

/* data shown next to each weekly reflection question */
function weeklyHints(state, weekStart) {
  const end = weekStart + 7 * DAY;
  const fin = finished(state), week = fin.filter(e => e.startedAt >= weekStart && e.startedAt < end);
  const over = week.filter(e => gapOf(e) != null && gapOf(e) >= 2);
  const before = fin.filter(e => e.startedAt < weekStart);
  let easier = null;
  groupStats(week, e => e.behaviourId).forEach(g => {
    const prev = summarize(before.filter(e => e.behaviourId === g.key));
    if (prev.avgActual != null && g.avgActual != null) { const d = prev.avgActual - g.avgActual; if (d > 0 && (!easier || d > easier.d)) easier = { d, name: behaviourLabel(state, g.key).name, now: g.avgActual, prev: prev.avgActual }; }
  });
  const trig = triggerStats(week)[0];
  return {
    n: week.length,
    overestimated: !week.length ? "No experiments this week." : over.length ? `${over.length} of ${week.length} experiments were at least 2 points easier than predicted (avg gap ${f1(avg(over.map(gapOf)))}).` : "No big overestimates this week.",
    easier: easier ? `${easier.name}: actual discomfort ${f1(easier.prev)} before this week → ${f1(easier.now)} this week.` : "Not enough history to compare yet.",
    trigger: trig ? `Most frequent trigger: "${trig.label}" (${trig.n}×).` : "No triggers logged this week.",
    next: recommendNext(state, end - 1).title
  };
}

/* ===== core/coach.js — AI coach: builds a grounded prompt from REAL records only ===== */
const COACH_RULES = `You are the behavioural coach inside "Rewrite Tracker", a personal app built on prediction-error learning: the user writes down what they predict will happen, tries an alternative behaviour, records what actually happened, and learns from the gap.

Rules:
- Use ONLY the data in <user_data>. Never invent experiments, numbers, dates, triggers or history. If the data is too thin to answer, say so plainly and suggest what to log.
- Label claims: say "Your data shows…" for things directly in the data, and "A possibility…" or "Hypothesis:" for interpretations.
- Be direct, warm and practical. No judgement about setbacks; treat them as useful data.
- Gently challenge distorted predictions (catastrophising, all-or-nothing, fortune-telling) and point out rationalisations or avoidance when the data suggests them.
- Do not present memory reconsolidation or any time window as proven. It is an experimental framework.
- No medical diagnosis. For smoking, mention that nicotine replacement, prescription medication from a doctor and counselling improve success when relevant. For trauma, serious relationship harm or crisis, recommend professional help.
- Format: short paragraphs and short bullet lists using "- ". No tables, no headings with #. Max ~250 words unless the user asks for more.
- End with one or two reflective questions when it fits.`;

const COACH_MODES = {
  review: { label: "Review my recent progress", prompt: "Review my recent experiments. Compare my most recent experiments with my earlier history. What is improving, what is stuck, and what should I focus on next?" },
  predictions: { label: "Challenge my predictions", prompt: "Look at how my predicted discomfort compares with what actually happened. Challenge any distorted predictions you can see in my data, quoting the relevant experiments." },
  setback: { label: "Review my last setback", prompt: "Look at my most recent unsuccessful or partial attempt. Review it without judgement: what happened, what the trigger was, and one concrete plan for next time." },
  next: { label: "Plan my next experiment", prompt: "Recommend the single most useful next experiment for me, based on my data. Give the behaviour, the situation, the alternative action, and what prediction I should write down." },
  avoidance: { label: "Spot avoidance patterns", prompt: "Look for avoidance or rationalisation patterns in my data (behaviours I stopped testing, alternatives I never complete, triggers I keep giving in to). Be honest and specific." }
};

function compactExp(state, e) {
  const b = behaviourLabel(state, e.behaviourId);
  const o = { date: dayKey(e.startedAt) + " " + fmtTime(e.startedAt), behaviour: b.name, status: e.status };
  const put = (k, v) => { if (v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length)) o[k] = v; };
  put("situation", e.situation); put("trigger", e.trigger); put("thought", e.thought); put("emotion", e.emotion);
  put("urge", e.urge); put("expectedDiscomfort", e.expectedDiscomfort); put("expectedDurationMin", e.expectedDurationMin); put("expectedConsequence", e.expectedConsequence);
  put("alternative", e.alternative); put("outcome", e.outcome); put("actualDiscomfort", e.actualDiscomfort); put("actualDurationMin", e.actualDurationMin);
  put("actualConsequence", e.actualConsequence); put("surprise", e.surprise); put("learned", e.learned); put("beliefConfidence", e.beliefConfidence);
  if (Object.keys(e.moduleData || {}).length) o.extra = e.moduleData;
  return o;
}

function buildCoachContext(state, now) {
  now = now || Date.now();
  const fin = finished(state), act = activeExps(state);
  const s = summarize(fin);
  const ctx = {
    today: dayKey(now),
    totals: { completedExperiments: fin.length, activeExperiments: act.length, avgUrge: s.avgUrge, avgExpectedDiscomfort: s.avgExpected, avgActualDiscomfort: s.avgActual, avgPredictionGap: s.avgGap, predictionsWithin1Point: s.accuracy, followThroughRate: s.followThrough, outcomes: s.counts },
    behaviours: behaviourProgress(state, fin).filter(b => !b.missing).map(b => ({ name: b.name, experiments: b.n, urgeTrend: b.trend.status, urgeFirst: b.trend.first, urgeLast: b.trend.last, avgGap: b.summary.avgGap, followThrough: b.summary.followThrough })),
    topTriggers: triggerStats(fin).slice(0, 6).map(t => ({ trigger: t.label, n: t.n, avgUrge: t.avgUrge })),
    timeOfDay: timeOfDayStats(fin).filter(b => b.n).map(b => ({ period: b.label, n: b.n, avgUrge: b.avgUrge, followThrough: b.followThrough })),
    alternatives: alternativeStats(fin).slice(0, 8).map(a => ({ alternative: a.label, n: a.n, followThrough: a.followThrough, avgActual: a.avgActual })),
    recentExperiments: fin.slice(-25).map(e => compactExp(state, e)),
    activeExperiments: act.map(e => compactExp(state, e)),
    recentJournal: live(state.journal).sort((a, b) => b.createdAt - a.createdAt).slice(0, 5).map(j => ({ date: dayKey(j.createdAt), type: j.type, title: j.title, text: (j.body || Object.values(j.answers).join(" | ")).slice(0, 400) }))
  };
  const sm = smokingStats(state, now);
  if (sm.hasSmokingBehaviour) ctx.smoking = { cravingsLogged: sm.cravings, cravingsPassedWithoutSmoking: sm.passed, passRate: sm.passRate, avgCravingMinutes: sm.avgCravingMin, cigarettesLoggedAsSmoked: sm.cigarettesLogged, hoursSinceLastLoggedCigarette: sm.sinceLast ? Math.round(sm.sinceLast / HOUR) : null };
  return JSON.stringify(ctx, (k, v) => typeof v === "number" ? Math.round(v * 100) / 100 : v);
}

function buildCoachMessages(state, history, userText, focusExp) {
  const data = buildCoachContext(state);
  const focus = focusExp ? `\n<focus_experiment>${JSON.stringify(compactExp(state, focusExp))}</focus_experiment>` : "";
  const header = `${COACH_RULES}\n\n<user_data>${data}</user_data>${focus}\n\n`;
  const msgs = history.slice(-10).map(m => ({ role: m.role, content: m.content }));
  if (!msgs.length) return [{ role: "user", content: header + userText }];
  msgs[0] = { role: "user", content: header + msgs[0].content };
  msgs.push({ role: "user", content: userText });
  return msgs;
}

/* ===== core/store.js — local persistence, multi-tab safety, outbox, backups ===== */
const LS = { state: "rt2_state", v1: "rewrite_tracker_state", outbox: "rt2_outbox", backups: "rt2_backups", drafts: "rt2_drafts", ui: "rt2_ui" };
const MAX_BACKUPS = 5;

let S = null;                 // current state
const outbox = new Set();     // "kind~id" keys not yet confirmed by the cloud
const storeListeners = new Set();
const loadNotices = [];       // shown once as banners
let storageOk = true;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsJSON(k, dflt) { const r = lsGet(k); if (r == null) return dflt; try { return JSON.parse(r); } catch (e) { return dflt; } }

function recKey(kind, id) { return kind + "~" + id; }
function parseKey(key) { const i = key.indexOf("~"); return i < 0 ? null : { kind: key.slice(0, i), id: key.slice(i + 1) }; }
function getByKey(key) { const p = parseKey(key); if (!p) return null; if (p.kind === "settings") return S.settings; return (S[p.kind] || {})[p.id] || null; }
function allKeys(st) { const ks = [recKey("settings", "main")]; for (const k of KINDS) for (const id in st[k]) ks.push(recKey(k, id)); return ks; }

function readLocalState() {
  const raw = lsGet(LS.state); if (raw == null) return null;
  try { return normalizeState(JSON.parse(raw)).state; } catch (e) { return null; }
}

function storeLoad() {
  const raw = lsGet(LS.state);
  if (raw != null) {
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = undefined; }
    if (parsed === undefined || !isPlainObj(parsed)) {
      lsSet("rt2_corrupt_" + Date.now(), raw);
      const b = lsJSON(LS.backups, []).filter(x => x && typeof x.json === "string").sort((a, c) => c.ts - a.ts)[0];
      let restored = null;
      if (b) { try { restored = normalizeState(JSON.parse(b.json)).state; } catch (e) { } }
      S = restored || seededState();
      loadNotices.push(restored ? `Saved data on this device was damaged. Restored the backup from ${fmtDateTime(b.ts)}. The damaged copy was kept.` : "Saved data on this device was damaged and could not be read. A copy was kept; starting fresh.");
      allKeys(S).forEach(k => outbox.add(k));
    } else {
      const r = normalizeState(parsed); S = r.state;
      if (r.issues.length && !looksV1(parsed)) loadNotices.push("Some stored records were invalid and skipped: " + r.issues.join(" "));
    }
  } else {
    const v1raw = lsGet(LS.v1); let migrated = null;
    if (v1raw) { try { const p = JSON.parse(v1raw); if (looksV1(p)) migrated = migrateV1(p); } catch (e) { } }
    if (migrated) { S = migrated; loadNotices.push(`Your data from the first version was upgraded (${live(S.experiments).length} rounds, ${live(S.behaviours).length} problems). The original copy is kept untouched.`); }
    else S = seededState(true);
    allKeys(S).forEach(k => outbox.add(k));
  }
  lsJSON(LS.outbox, []).forEach(k => typeof k === "string" && outbox.add(k));
  storePersist(true);
  maybeAutoBackup();
  try { window.addEventListener("storage", onStorageEvent); } catch (e) { }
  return S;
}

function onStorageEvent(e) {
  if (e.key === LS.state && e.newValue) {
    const other = readLocalState(); if (!other) return;
    S = mergeStates(S, other);
    lsJSON(LS.outbox, []).forEach(k => outbox.add(k));
    emitChange({ source: "tab" });
  }
}

function storePersist(skipMerge) {
  if (!skipMerge) { const cur = readLocalState(); if (cur) S = mergeStates(S, cur); }
  storageOk = lsSet(LS.state, JSON.stringify(S));
  lsSet(LS.outbox, JSON.stringify([...outbox]));
  return storageOk;
}
function onStoreChange(fn) { storeListeners.add(fn); return () => storeListeners.delete(fn); }
function emitChange(info) { storeListeners.forEach(fn => { try { fn(info || {}); } catch (e) { console.error(e); } }); }

function nextTs(prev) { return Math.max(Date.now(), ((prev && prev.updatedAt) || 0) + 1); }

/* ---------- mutations (all go through here) ---------- */
function putRecord(kind, rec) {
  const prev = S[kind][rec.id];
  const clean = cleanRecord(kind, Object.assign({}, rec, { updatedAt: nextTs(prev), createdAt: rec.createdAt || (prev && prev.createdAt) || Date.now() }));
  if (!clean || clean.deleted) throw new Error("Record failed validation");
  S[kind][clean.id] = clean;
  outbox.add(recKey(kind, clean.id));
  storePersist(); emitChange({ source: "local", kind, id: clean.id });
  return clean;
}
function removeRecord(kind, id) {
  const prev = S[kind][id]; if (!prev || prev.deleted) return;
  S[kind][id] = tombstone(id, nextTs(prev));
  outbox.add(recKey(kind, id));
  storePersist(); emitChange({ source: "local", kind, id });
}
function putSettings(patch) {
  S.settings = cleanSettings(Object.assign({}, S.settings, patch, { updatedAt: nextTs(S.settings) }));
  outbox.add(recKey("settings", "main"));
  storePersist(); emitChange({ source: "local", kind: "settings" });
}
/* remote record arrives; returns true if it changed local state */
function applyRemote(kind, rec) {
  const clean = cleanRecord(kind, rec); if (!clean) return false;
  const cur = kind === "settings" ? S.settings : S[kind][clean.id];
  if (pickNewer(cur, clean) === cur && cur) return false;
  if (kind === "settings") S.settings = clean; else S[kind][clean.id] = clean;
  return true;
}

/* bulk operations: import, restore, reset */
function bulkApply(incoming, mode) {
  backupNow(mode === "reset" ? "Before reset" : mode === "replace" ? "Before replace/restore" : "Before import");
  const now = Date.now();
  let added = 0, kept = 0, removed = 0;
  for (const k of KINDS) {
    const inc = incoming ? incoming[k] : {};
    if (mode !== "merge") {
      for (const id in S[k]) if (!S[k][id].deleted && !(inc && inc[id] && !inc[id].deleted)) { S[k][id] = tombstone(id, nextTs(S[k][id])); outbox.add(recKey(k, id)); removed++; }
    }
    for (const id in (inc || {})) {
      const r = inc[id]; if (r.deleted) continue;
      const cur = S[k][id];
      if (mode === "merge" && cur && !cur.deleted) { const w = pickNewer(cur, r); if (w !== cur) { S[k][id] = r; outbox.add(recKey(k, id)); added++; } else kept++; continue; }
      S[k][id] = Object.assign({}, r, { updatedAt: Math.max(now, ((cur && cur.updatedAt) || 0) + 1) });
      outbox.add(recKey(k, id)); added++;
    }
  }
  if (incoming && mode !== "merge") { S.settings = Object.assign({}, incoming.settings, { updatedAt: nextTs(S.settings) }); outbox.add(recKey("settings", "main")); }
  storePersist(true); emitChange({ source: "bulk" });
  return { added, kept, removed };
}
function resetAll() {
  const fresh = seededState();
  const r = bulkApply(fresh, "reset");
  return r;
}

/* ---------- backups (on this device) ---------- */
function listBackups() { return lsJSON(LS.backups, []).filter(b => b && typeof b.json === "string" && b.ts).sort((a, b) => b.ts - a.ts); }
function backupNow(reason) {
  const list = listBackups();
  const json = JSON.stringify(exportPayload(S).data);
  if (list[0] && list[0].json === json) return true;
  list.unshift({ ts: Date.now(), reason: reason || "Manual backup", json });
  let keep = list.slice(0, MAX_BACKUPS);
  while (keep.length && !lsSet(LS.backups, JSON.stringify(keep))) keep = keep.slice(0, keep.length - 1);
  return keep.length > 0;
}
function maybeAutoBackup() {
  const last = listBackups().find(b => b.reason === "Automatic daily backup");
  const hasData = live(S.experiments).length + live(S.journal).length > 0;
  if (hasData && (!last || Date.now() - last.ts > DAY)) backupNow("Automatic daily backup");
}
function restoreBackup(tsv) {

    h("div", { class: "kvs" }, kv("Situation", e.situation), kv("Trigger", e.trigger), kv("Emotion", e.emotion), kv("Automatic thought", e.thought), kv("Expected duration (min)", e.expectedDurationMin), kv("Expected consequence", e.expectedConsequence), kv("Alternative", e.alternative), mdRows),
    h("h3", { class: "h3" }, "Result and reflection (editable)"),

    field("Actual duration (minutes)", numberInput(f, "actualDurationMin", { min: 0, max: 10080 })),
    field("What actually happened", textArea(f, "actualConsequence", { rows: 2, maxlength: 500 })),

    field("What you learned", textArea(f, "learned", { rows: 2, maxlength: 1000 })),
    field("Reflection notes", textArea(f, "notes", { rows: 3, maxlength: 4000 })),
    rating("Confidence in the new belief", f, "beliefConfidence", { max: 100, step: 5, unit: "%", color: C.violet }),
    field("Tags", tagsInput(f, "tags")),
    h("label", { class: "check" }, h("input", { type: "checkbox", checked: f.highlight, onchange: ev => f.highlight = ev.target.checked }), "Highlight this lesson"), err
  ], actions, { wide: true, focus: ".btn.primary" }).then(async v => {
    if (v === "delete") { if (await confirmDialog({ title: "Delete this experiment?", body: "It will be removed from your journal and analytics on all your devices. This can't be undone (except from a backup).", confirm: "Delete", danger: true })) { removeRecord("experiments", id); toast("Experiment deleted."); } }

}

/* ---------- free notes ---------- */

/* ===== ui/view-goals.js — measurable goals computed from records ===== */
function goalProgress(g, now) {
  now = now || Date.now();
  const fin = finished(S).filter(e => !g.behaviourId || e.behaviourId === g.behaviourId);
  let cur = null, n = 0, note = "";
  if (g.metric === "rounds_week") { cur = fin.filter(e => e.startedAt >= startOfWeek(now)).length; n = cur; note = "since Monday"; }
  if (g.metric === "followthrough_10") { const sc = fin.filter(e => e.outcome).slice(-10); n = sc.length; cur = n ? avg(sc.map(e => OUTCOME_SCORE[e.outcome])) * 100 : null; note = `last ${n} with an outcome`; }
  if (g.metric === "urge_avg_7") { const u = fin.filter(e => e.urge != null).slice(-7); n = u.length; cur = n >= 3 ? avg(u.map(e => e.urge)) : null; note = n >= 3 ? `last ${n} experiments` : "needs 3+ experiments"; }
  if (g.metric === "confidence_avg_5") { const c = fin.filter(e => e.beliefConfidence != null).slice(-5); n = c.length; cur = n ? avg(c.map(e => e.beliefConfidence)) : null; note = n ? `last ${n} ratings` : "no ratings yet"; }
  if (g.metric === "smokefree_days") { const sm = smokingStats(S, now); cur = sm.sinceLast != null ? sm.sinceLast / DAY : null; n = sm.lastCig ? 1 : 0; note = sm.lastCig ? "since last logged cigarette" : "log a cigarette or set a date in Settings"; }
  const meta = GOAL_METRICS[g.metric];
  const met = cur == null ? false : meta.dir === ">=" ? cur >= g.target : cur <= g.target;
  const frac = cur == null ? 0 : meta.dir === ">=" ? Math.min(1, g.target ? cur / g.target : 1) : (met ? 1 : Math.max(0, Math.min(1, (10 - cur) / Math.max(0.01, 10 - g.target))));
  return { cur, met, frac, note, n };
}

VIEWS.goals = function () {
  const goals = live(S.goals).sort((a, b) => a.archived - b.archived || b.createdAt - a.createdAt);
  const root = h("div", { class: "stack-lg" }, pageHeader("Goals", "Targets measured from your experiments, not from ticking boxes.", h("button", { class: "btn primary", onclick: () => goalDialog() }, icon("plus"), "New goal")));

  root.append(h("div", { class: "goal-grid" }, goals.map(g => {
    const p = goalProgress(g), meta = GOAL_METRICS[g.metric];
    const val = p.cur == null ? "–" : (g.metric === "smokefree_days" ? f1(p.cur) : meta.unit === "%" ? Math.round(p.cur) : f1(p.cur));
    return h("article", { class: "card goal" + (g.archived ? " archived" : "") },
      h("div", { class: "row between" }, h("h3", {}, g.title || meta.label), p.met ? h("span", { class: "pill good" }, "✓ On target") : h("span", { class: "pill muted" }, "In progress")),
      h("div", { class: "muted sm" }, meta.label + (g.behaviourId ? " · " + bName(g.behaviourId) : " · all behaviours")),
      h("div", { class: "goal-v" }, h("b", {}, val + (p.cur == null ? "" : meta.unit)), h("span", { class: "muted" }, ` ${meta.dir === ">=" ? "target ≥" : "target ≤"} ${g.target}${meta.unit}`)),
      h("div", { class: "meter", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": 100, "aria-valuenow": Math.round(p.frac * 100), "aria-label": "Progress towards goal" }, h("div", { style: { width: p.frac * 100 + "%", background: p.met ? C.good : C.violet } })),
      h("div", { class: "muted xs" }, p.note),

  })));
  return root;
};

function goalDialog(g) {
  const m = g ? { title: g.title, metric: g.metric, target: g.target, behaviourId: g.behaviourId || "", why: g.why } : { title: "", metric: "rounds_week", target: 4, behaviourId: "", why: "" };

}

    field("Currency symbol", h("input", { type: "text", class: "input", maxlength: 5, value: st.currency, onchange: e => { putSettings({ currency: e.target.value.trim() || "€" }); toast("Saved."); } })),
    h("label", { class: "check" }, h("input", { type: "checkbox", checked: st.aiEnabled, onchange: e => { putSettings({ aiEnabled: e.target.checked }); } }), "Enable the AI coach (sends a summary of your records to Claude only when you ask it something)")]));

  // data
  const counts = KINDS.map(k => `${live(S[k]).length} ${({ behaviours: "behaviours", experiments: "experiments", journal: "journal entries", goals: "goals", smokingLog: "smoking log entries" })[k]}`).join(" · ");
  root.append(card("Sync", [h("p", { id: "sync-detail" }, syncState.message), h("p", { class: "muted sm" }, counts),
    h("p", { class: "muted sm" }, "Data is saved on this device first, so the app works offline and survives reloads. The claude.ai version also syncs every record to private storage that only you can read; the standalone web app keeps data on this device, so export regularly or move data between versions with Export and Import. If the same record is changed on two devices, the most recent change wins for that record only; nothing else is overwritten."),
    outbox.size ? h("p", { class: "muted sm" }, `${plural(outbox.size, "change")} waiting to sync.`) : null]));

  root.append(card("Export", [h("p", { class: "muted sm" }, "A complete JSON copy of your data (schema version " + SCHEMA_VERSION + "). Keep it somewhere safe; you can import it here or on another device."),
    h("div", { class: "row" }, UI.downloads || canBlobDownload() ? h("button", { class: "btn primary", onclick: doDownload }, "Download JSON") : null, linkBtn("Show / copy JSON", () => { prefsUI.exportText = JSON.stringify(exportPayload(S), null, 2); render(); })),
    prefsUI.exportText ? [h("textarea", { class: "input mono", rows: 8, readonly: true, "aria-label": "Exported data", value: prefsUI.exportText }), h("div", { class: "row" }, linkBtn("Copy to clipboard", async () => { try { await navigator.clipboard.writeText(prefsUI.exportText); toast("Copied."); } catch (e) { toast("Copy was blocked. Select the text and copy it manually.", "error"); } }), linkBtn("Hide", () => { prefsUI.exportText = null; render(); }))] : null]));

  const ir = prefsUI.importResult;

    h("details", { open: !!prefsUI.pasteOpen, ontoggle: e => prefsUI.pasteOpen = e.target.open }, h("summary", { class: "muted sm" }, "…or paste JSON"), h("textarea", { class: "input mono", rows: 5, "aria-label": "Paste JSON to import", value: prefsUI.pasteOpen ? prefsUI.importText : "", oninput: e => prefsUI.importText = e.target.value }), linkBtn("Check pasted data", () => { prefsUI.importResult = parseImport(prefsUI.importText || ""); render(); })),

    backups.length ? h("div", { class: "list" }, backups.map(b => { let n = "?"; try { n = (JSON.parse(b.json).experiments || []).length; } catch (e) { } return h("div", { class: "alt-row" }, h("span", {}, fmtDateTime(b.ts) + " · " + b.reason + " · " + plural(n, "experiment")),

  root.append(card("About this method", [h("p", { class: "muted sm" }, "Rewrite Tracker uses a prediction → experience → evidence → learning loop, similar to behavioural experiments in cognitive behavioural therapy and exposure-based approaches. It's a self-help tool, not treatment. For addiction, trauma, or persistent low mood, please involve a doctor or therapist."),
    h("p", { class: "muted xs" }, `Schema v${SCHEMA_VERSION}` + (S.meta.migratedFromV1 ? " · upgraded from v1 on " + fmtDate(S.meta.migratedFromV1) : ""))]));
  return root;
};

/* outside claude.ai (e.g. the GitHub Pages web app) a normal browser download works */
function canBlobDownload() { try { return window.self === window.top && typeof Blob !== "undefined" && "download" in document.createElement("a"); } catch (e) { return false; } }
async function doDownload() {
  const data = JSON.stringify(exportPayload(S), null, 2);
  const filename = "rewrite-tracker-" + dayKey(Date.now()) + ".json";
  if (!UI.downloads) {
    try { const url = URL.createObjectURL(new Blob([data], { type: "application/json" })); const a = h("a", { href: url, download: filename }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); toast("Export downloaded."); }
    catch (e) { prefsUI.exportText = data; render(); toast("Download wasn't possible. Copy the JSON below instead.", "error"); }
    return;
  }
  try { await UI.downloads.save({ filename, data }); toast("Export ready."); }
  catch (e) {
    if (e && e.code === "declined") { toast("Download cancelled."); return; }
    if (e && (e.code === "unavailable" || e.code === "not_granted" || e.code === "capability_disabled")) UI.downloads = null;
    prefsUI.exportText = data; render(); toast("Download wasn't possible here. You can copy the JSON below instead.", "error");
  }
}
